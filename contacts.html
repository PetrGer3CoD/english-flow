<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты | EnglishFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contacts.css">
</head>
<body>

<header>
    <div class="logo">EnglishFlow</div>
    <nav>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="courses.html">Курсы</a></li>
            <li><a href="contacts.html">Контакты</a></li>
        </ul>
    </nav>
</header>

<section class="contacts-page">
    <div class="contacts-info">
        <h2>Свяжитесь с нами</h2>
        
        <div class="info-item">
            <span class="icon">📍</span>
            <p>м. Маяковская, ул. Тверская 15, офис 404</p>
        </div>
        
        <div class="info-item">
            <span class="icon">📞</span>
            <p>+7 (999) 456-78-90</p>
        </div>
        
        <div class="info-item">
            <span class="icon">✉️</span>
            <p>hello@englishflow.ru</p>
        </div>
        
        <div class="info-item">
            <span class="icon">🕒</span>
            <p>Пн–Сб 10:00–21:00</p>
        </div>
    </div>

    <div class="contact-form">
        <h2>Запись на пробный урок</h2>
        <form>
            <input type="text" placeholder="Ваше имя" required>
            <input type="email" placeholder="Email или телефон" required>
            <select>
                <option>Начинающий</option>
                <option>Средний</option>
                <option>Продвинутый</option>
            </select>
            <button type="submit" class="btn">Записаться на пробный урок</button>
        </form>
    </div>
</section>

<footer>
    <p>© 2025 EnglishFlow. Учите английский с нами. Аслан</p>
</footer>
